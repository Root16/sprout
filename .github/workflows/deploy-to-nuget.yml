# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Deploy to NuGet

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
    - uses: actions/checkout@v4
    
    - name: Set variables
      id: setvars
      run: |
        if [[ "${{github.base_ref}}" == "main" || "${{github.ref}}" == "refs/heads/main" ]]; then
          echo "VERSION_SUFFIX=${{github.run_number}}" >> "$GITHUB_ENV"
        fi

        if [[ "${{github.base_ref}}" == "alpha" || "${{github.ref}}" == "refs/heads/alpha" ]]; then
        echo "VERSION_SUFFIX=alpha.${{github.run_number}}" >> "$GITHUB_ENV"
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'
        source-url: https://api.nuget.org/v3/index.json
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.NUGET_API_KEY }}
    
    - name: Build solution and generate NuGet package
      run: |
          dotnet pack -c Release -o out -p:PackageVersion="1.0.0.$VERSION_SUFFIX" -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg Root16.Sprout.sln
    - name: Push
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push out/*.nupkg --skip-duplicate --api-key $NUGET_API_KEY -s https://api.nuget.org/v3/index.json
